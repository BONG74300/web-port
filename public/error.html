<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Internal Service Worker Error</title>
  <style>
    body {
      background-color: #000000;
      color: #f5f5f5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .error-container {
      max-width: 640px;
      padding: 24px 28px;
      border-radius: 8px;
      background: #1e1e1e;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
      border: 1px solid #333;
    }
    .error-title {
      font-size: 1.3rem;
      margin-bottom: 10px;
      color: #ff6b6b;
    }
    .error-message {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #e0e0e0;
    }
    .error-code {
      margin-top: 14px;
      font-size: 0.85rem;
      color: #999;
      font-family: "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-title">Internal Service Worker Error</div>
    <div class="error-message">
      Internal Service Worker Error: attempted to fetch from same origin - this means the site has obtained a reference to the real origin, aborting.
    </div>
    <div class="error-code">
      ERROR_CODE: SW_ORIGIN_LEAK_DETECTED
    </div>
  </div>
</body>
</html>
